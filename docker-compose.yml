services:
  postgres:
    image: postgres:16-alpine
    container_name: assetcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: assetcore
      POSTGRES_USER: assetcore
      POSTGRES_PASSWORD: assetcore_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assetcore -d assetcore"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assetcore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  backend:
    image: node:20-alpine
    container_name: assetcore-backend
    restart: unless-stopped
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "cp -n .env.example .env && ( [ -x node_modules/.bin/ts-node ] || npm install ) && npm run prisma:generate && npm run dev",
      ]
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 4000
      JWT_SECRET: assetcore_dev_secret_change_me
      REFRESH_TOKEN_SECRET: assetcore_refresh_secret_change_me
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://assetcore:assetcore_dev@postgres:5432/assetcore
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    image: node:20-alpine
    container_name: assetcore-frontend
    restart: unless-stopped
    working_dir: /app
    command:
      [
        "sh",
        "-c",
        "( [ -x node_modules/.bin/vite ] || npm install ) && npm run dev",
      ]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      VITE_API_URL: /api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  frontend_node_modules:
